        if (res && res.choose) {
          const remote = res.choose;
          openSheet({ title: 'Quelles données garder ?', ok: 'Valider',
            body: `<p class="lead">Cet appareil et votre compte contiennent chacun des données. Choisissez celles à garder sur tous vos appareils. L’autre version est mise de côté et reste restaurable.</p>
              <div class="fields"><div class="fld wide"><label for="f-keep">Garder</label><select id="f-keep" name="keep">
              <option value="remote">Données du compte : ${remote.lots.length} position(s), modifiées le ${new Date(remote.updatedAt).toLocaleString('fr-FR')}</option>
              <option value="local">Données de cet appareil : ${S.lots.length} position(s), modifiées le ${new Date(S.updatedAt).toLocaleString('fr-FR')}</option></select></div></div>`,
            onSubmit: async form => {
              if (F(form, 'keep') === 'remote') { writeJSON(CONFLICT_KEY, { at: Date.now(), from: 'cet appareil', state: S }); adoptRemote(remote); }
              else { writeJSON(CONFLICT_KEY, { at: Date.now(), from: 'en ligne', state: remote }); S.updatedAt = Date.now(); writeLocal(); await pushRemote(); }
              Store.lastOk = Date.now(); setSync('synced'); render(); toast('Synchronisation activée');
            } });
        } else toast(res === 'pulled' ? 'Synchronisation activée : données récupérées' : 'Synchronisation activée');
      }, e => { setSync('error', e.message); toast('Connexion impossible : ' + (e instanceof TypeError ? 'pas de réseau' : e.message)); b.disabled = false; });
      break;
    }
    case 'sync-off': confirmSheet('Déconnecter cet appareil ?', 'Les données restent sur cet appareil et dans votre Gist. Cet appareil ne se synchronisera plus et le jeton y sera effacé.', 'Déconnecter', () => {
      Store.cfg = null; writeJSON(SYNC_KEY, null); setSync('local'); render(); toast('Appareil déconnecté'); }); break;
    case 'restore-conflict': confirmSheet('Restaurer la version mise de côté ?', 'Elle remplacera les données actuelles sur tous vos appareils. La version actuelle sera mise de côté à son tour.', 'Restaurer', () => {
      const c = readJSON(CONFLICT_KEY, null); if (!c) return;
      writeJSON(CONFLICT_KEY, { at: Date.now(), from: 'avant restauration', state: S });
      S = normalize(c.state); calcDraft = null; save('Version restaurée'); }); break;
    case 'drop-conflict': writeJSON(CONFLICT_KEY, null); render(); break;
    case 'import-json': sheetImport(); break;
    case 'load-demo': loadDemo(); save('Données de démonstration chargées'); break;
    case 'clear-demo': confirmSheet('Effacer la démonstration ?', 'Seules les données marquées « Démo » sont supprimées. Vos propres saisies restent.', 'Effacer la démo', () => { clearDemo(); save('Démonstration effacée'); }); break;
    case 'wipe': confirmSheet('Effacer toutes les données ?', 'Positions, flux, valeurs courtier, cours, réglages et captures seront supprimés. Exportez d’abord en JSON si besoin.', 'Tout effacer', async () => {
      for (const l of S.lots) for (const id of lotImgIds(l)) await delImage(id); S = defaultState(); calcDraft = null; save('Toutes les données ont été effacées'); }); break;
    case 'copy-ta': {
      const ta = $('#exportTa'), text = window.__exportText || ta.value;
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Contenu copié'), () => { ta.select(); toast('Sélectionné : copiez avec ⌘C / Ctrl+C'); });
      else { ta.select(); toast('Sélectionné : copiez avec ⌘C / Ctrl+C'); }
      break;
    }
  }
});
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.matches || !d.matches('details.lot')) return;
  if (d.open) { openLots.add(d.dataset.key); loadThumbs(); } else openLots.delete(d.dataset.key);
}, true);
document.addEventListener('input', e => {
  if (e.target.id === 'pos-q') { posQuery = e.target.value; applyPosQuery(); return; }
  if (e.target.id === 'radar-q') { radarQuery = e.target.value; applyRadarQuery(); return; }
  if (e.target.id === 'price-q') {
    const q = e.target.value.trim().toLowerCase();
    for (const r of document.querySelectorAll('#sheet .pr')) r.hidden = !!q && !r.dataset.t.includes(q);
    if (q) for (const d of document.querySelectorAll('#sheet details.more')) d.open = true;
    return;
  }
  const f = e.target.form;
  if (f && f.id === 'calcForm') {
    const el = e.target;
    calcDraft[el.name] = el.type === 'checkbox' ? el.checked : el.value;
    if (el.name !== 'ticker') calcDraft.example = false;
    if (el.name === 'fractional') $('#c-decimals').disabled = !el.checked;
    updateCalc();
  } else if (f && f.id === 'sheetForm' && sheetCfg && sheetCfg.onInput) {
    if (e.target.name === 'fee') e.target.dataset.touched = '1';
    sheetCfg.onInput(f);
  }
});
document.addEventListener('change', e => { if (e.target.form && e.target.form.id === 'calcForm' && e.target.type === 'checkbox') e.target.dispatchEvent(new Event('input', { bubbles: true })); });
document.addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target;
  if (form.id === 'setForm') {
    const g = n => form.elements[n].value, s = S.settings;
    const v = { initialCapital: num(g('initialCapital')), riskPct: num(g('riskPct')), cap: num(g('cap')), leverage: num(g('leverage')), staleDays: num(g('staleDays')), decimals: num(g('decimals')) };
    const fz = { inFixed: numOr(g('inFixed'), 0), inPct: numOr(g('inPct'), 0), outFixed: numOr(g('outFixed'), 0), outPct: numOr(g('outPct'), 0) };
    const errs = [];
    if (!(v.initialCapital > 0)) errs.push('capital initial');
    if (!(v.riskPct > 0 && v.riskPct <= 100)) errs.push('risque');
    if (!(v.cap > 0)) errs.push('plafond');
    if (!(v.leverage >= 1)) errs.push('levier');
    if (!(v.staleDays >= 0)) errs.push('alerte');
    if (!(Number.isInteger(v.decimals) && v.decimals >= 0 && v.decimals <= 8)) errs.push('précision (entier 0 à 8)');
    if (Object.values(fz).some(x => !(x >= 0))) errs.push('frais');
    if (!g('startDate')) errs.push('date de départ');
    if (errs.length) { toast('Valeurs invalides : ' + errs.join(', ')); return; }
    Object.assign(s, v, { fees: fz, fractional: form.elements.fractional.checked, startDate: g('startDate'), refSource: g('refSource') });
    calcDraft = null; save('Réglages enregistrés');
    return;
  }
  if (form.id === 'sheetForm' && sheetCfg && sheetCfg.onSubmit) {
    const btn = $('#sheetOk'); btn.disabled = true;
    try { const cfg = sheetCfg; await cfg.onSubmit(form); if (sheetCfg === cfg) closeSheet(); }
    catch (err) { $('#sheetErr').textContent = err.message || String(err); }
    finally { btn.disabled = false; }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

// ---------- Démarrage ----------
(function boot() {
  const local = readLocal();
  if (local) S = normalize(local);
  try { const h = location.hash.slice(1); if (['dash', 'calc', 'pos', 'radar', 'set'].includes(h)) tab = h; } catch (e) {}
  Store.cfg = readJSON(SYNC_KEY, null);
  if (!local) { loadDemo(); S.updatedAt = 0; writeLocal(); }
  render();
  if (Store.cfg) { setSync('saving'); syncNow(); } else setSync('local');
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  // Cours automatiques : à l'ouverture, au retour sur l'app, puis toutes les 2 minutes pendant la séance.
  refreshQuotes();
  loadRadarCache().then(() => { render(); refreshRadar(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (Date.now() - Live.at > 60000) refreshQuotes(); refreshRadar(); } });
  setInterval(() => { if (document.visibilityState === 'visible' && tab !== 'calc' && marketOpen(Date.now())) refreshQuotes(false, Date.now() - (Live.fullAt || 0) < 600000); }, 120000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Store.cfg) scheduleSync(200); });
  window.addEventListener('online', () => { if (Store.cfg) scheduleSync(200); });
  setInterval(() => { if (Store.cfg && document.visibilityState === 'visible') syncNow(); }, 60000);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    const hadCtrl = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtrl && $('#sheet').hidden) location.reload(); });
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(r => { document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update().catch(() => {}); }); }).catch(() => {});
  }
})();
</script>
</body>
</html>
