<style>
/* Layout : une colonne sur iPhone, grilles au-delà de 820 px ; onglets à icônes en bas sur mobile, en haut sur ordinateur. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F3F5F8; --ink:#121A24; --muted:#5E6B7A; --line:#E0E5EB;
  --accent:#2457C5; --accent-ink:#FFFFFF; --accent-soft:#E4ECFB; --hero-a:#16264A; --hero-b:#24468C; --hero-ink:#FFFFFF; --hero-muted:#B9C7E4;

  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1016; --surface:#141B24; --surface-2:#1A232E; --ink:#E7EDF3; --muted:#93A1B1; --line:#253140;
  --accent:#7FA8F5; --accent-ink:#0B1016; --accent-soft:#1A2943; --hero-a:#13213F; --hero-b:#1E3A75; --hero-ink:#FFFFFF; --hero-muted:#A8B8DA;
  --gain:#4FD195; --loss:#FF8A7D; --warn:#F0BD5E; --warn-bg:#2D2412; --loss-bg:#341A19; --gain-bg:#11291E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1016; --surface:#141B24; --surface-2:#1A232E; --ink:#E7EDF3; --muted:#93A1B1; --line:#253140;
  --accent:#7FA8F5; --accent-ink:#0B1016; --accent-soft:#1A2943; --hero-a:#13213F; --hero-b:#1E3A75; --hero-ink:#FFFFFF; --hero-muted:#A8B8DA;
  --gain:#4FD195; --loss:#FF8A7D; --warn:#F0BD5E; --warn-bg:#2D2412; --loss-bg:#341A19; --gain-bg:#11291E;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--f-body);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.18rem}

.num,td.n,.kv dd{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.08rem;display:flex;align-items:center;gap:10px;white-space:nowrap}

.sync{margin-left:auto;font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:6px;max-width:100%;background:var(--surface-2);padding:4px 10px;border-radius:99px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-s="synced"] i{background:var(--gain);box-shadow:0 0 0 3px var(--gain-bg)} .sync[data-s="local"] i{background:var(--warn)} .sync[data-s="error"] i{background:var(--loss)}

@media (max-width:819px){

    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}

}

main{padding-block:18px 28px;display:grid;gap:16px}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0;box-shadow:var(--shadow)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lead{font-size:.86rem;color:var(--muted);margin:0;max-width:70ch}
.grid2{display:grid;gap:16px}
@media (min-width:820px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
/* Bannières */

.banner.warn{background:var(--warn-bg);color:var(--warn)} .banner.err{background:var(--loss-bg);color:var(--loss)} .banner.info{background:var(--accent-soft);color:var(--ink)}
.banner .btn{margin-left:auto}
/* Alertes */
.alerts{display:grid;gap:8px}
.alert{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-size:.88rem;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.alert::before{content:"";width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.alert.err{background:var(--loss-bg);border-color:transparent;color:var(--loss)} .alert.err::before{background:var(--loss)}
.alert.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)} .alert.warn::before{background:var(--warn)}
.alert.ok{color:var(--muted)} .alert.ok::before{background:var(--gain)}
.alert.live::before{background:var(--muted)} .alert.live.on::before{background:var(--gain);box-shadow:0 0 0 3px var(--gain-bg)}
.alert small{font-size:.76rem;color:var(--muted)}
.alert span{flex:1;min-width:0} .alert .btn{flex:none}
.alerts details summary{cursor:pointer;font-size:.82rem;color:var(--muted);padding:2px 4px}
.alerts details[open]{display:grid;gap:8px}
/* Carte principale */
.hero-card{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-radius:var(--r);padding:20px;display:grid;gap:14px;box-shadow:var(--shadow)}
.hero-card .lbl{color:var(--hero-muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.hero-card .big{font:600 2.5rem/1.05 var(--f-num);letter-spacing:-.03em}
.hero-card small,.hero-card .muted{color:var(--hero-muted)}
.hero-card .chg{display:inline-flex;gap:6px;align-items:center;font:600 .9rem var(--f-num);padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.12)}
.hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.hero-stats div{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px}
.hero-stats dt{color:var(--hero-muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.hero-stats dd{margin:2px 0 0;font:600 1.02rem var(--f-num)}
.hero-card .up{color:#7BE3AE} .hero-card .down{color:#FFA89E}
.gauge{display:grid;gap:6px}
.gauge .track{height:8px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.gauge .track i{display:block;height:100%;border-radius:99px;background:#7BE3AE}
.gauge .track i.mid{background:#F5C76A} .gauge .track i.hi{background:#FF8F82}

/* Valeurs */
.hero{display:grid;gap:4px}

.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:0}
.kv div{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.kv dt{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}

.pos{color:var(--gain)} .neg{color:var(--loss)} .wrn{color:var(--warn)}
.pill{display:inline-block;font:600 .68rem var(--f-body);padding:3px 8px;border-radius:99px;letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);vertical-align:middle}
.pill.open{background:var(--accent-soft);color:var(--accent)} .pill.win{background:var(--gain-bg);color:var(--gain)} .pill.loss{background:var(--loss-bg);color:var(--loss)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.demo{background:var(--warn-bg);color:var(--warn)} .pill.earn{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);text-transform:none;letter-spacing:0}
details.more>summary{cursor:pointer;font-size:.84rem;font-weight:600;color:var(--accent);list-style:none}

details.more[open]>summary{margin-bottom:10px}
/* Formulaires */
form .fields,.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.fld{display:grid;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
label,.lbl{font-size:.8rem;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{min-height:70px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--ink);font-weight:500}
.hint{font-size:.76rem;color:var(--muted);margin:0}
.btn{font:600 .88rem var(--f-body);border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--loss);border-color:color-mix(in srgb,var(--loss) 45%,transparent)}
.btn.sm{padding:6px 11px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.result{display:grid;gap:12px}
.qty-big{font:600 2.2rem/1.1 var(--f-num);color:var(--accent)}
.reason{font-size:.88rem;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 10px;margin:0}
.fine{font-size:.76rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin:0}
.errs{margin:0;padding:10px 12px 10px 28px;background:var(--loss-bg);color:var(--loss);border-radius:10px;font-size:.9rem}
/* Tableaux */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2)}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
/* Positions */
.pgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;align-content:start;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0}
.pcard::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--line)}
.pcard.up::before{background:var(--gain)} .pcard.down::before{background:var(--loss)}
.pcard.danger{border-color:var(--loss)} .pcard.danger::before{background:var(--loss)}
.pcard header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pcard .tk{font-size:1.15rem}
.rlist{display:grid;gap:10px}
.elist{display:grid} .erow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-top:1px solid var(--line);font-size:.9rem} .erow .muted{color:var(--muted);font-size:.84rem} .ewk{font-size:.78rem;color:var(--muted);margin:14px 0 2px;font-weight:600} .hint.warn-t{color:var(--warn)} .ecd{font-size:.74rem;color:var(--muted);white-space:nowrap} .ecd.hot{background:var(--loss-bg);color:var(--loss);padding:2px 8px;border-radius:99px;font-weight:600}
.estrip{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface-2);border-radius:12px;padding:4px;margin-top:6px} .eday{text-align:center;padding:6px 0 5px;border-radius:9px;font-size:.72rem;color:var(--muted);border:1px solid transparent} .eday b{display:block;font-size:.95rem;color:var(--ink);font-weight:600} .eday.today{background:var(--surface);border-color:var(--line)} .eday.past{opacity:.45}
.edots,.elegend{display:flex;justify-content:center;gap:3px;height:7px;margin-top:3px} .edots i,.elegend i{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--muted)} .edots em{font-size:.6rem;line-height:7px;font-style:normal}
i.p{background:var(--accent)!important} i.n{background:var(--warn)!important} i.r{background:var(--muted)!important} .elegend{justify-content:flex-start;height:auto;align-items:center;gap:5px;font-size:.72rem;color:var(--muted);margin:6px 0 10px}
.eitem{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:var(--surface)} .eitem.pos{border:1.5px solid var(--accent)}
.etile{width:48px;flex-shrink:0;text-align:center;background:var(--surface-2);border-radius:10px;padding:5px 0;font-size:.7rem;color:var(--muted);line-height:1.25} .etile b{display:block;font-size:1.2rem;color:var(--ink);font-weight:600}
.ebody{flex:1;min-width:0} .ehead{display:flex;justify-content:space-between;align-items:center;gap:8px} .ehead strong{font-size:1rem} .emeta{margin:3px 0 0;font-size:.8rem;color:var(--muted)} .ewarn{margin:2px 0 0;font-size:.8rem;color:var(--warn)}
.eic{font-style:normal} .eic.bmo{color:var(--warn)} .eic.amc{color:var(--accent)} .echips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px} .echip{font-size:.8rem;padding:4px 10px;border:1px solid var(--line);border-radius:99px} .echip.pos{border-color:var(--accent)} .egrid{display:grid;grid-template-columns:auto auto 1fr;gap:2px 10px;font-size:.8rem;margin-top:6px;align-items:center} .egrid>span:nth-child(3n+1),.egrid>span:nth-child(3n+2){white-space:nowrap} .egrid>span:nth-child(3n){text-align:right;font-size:.74rem} .egrid .k,.egrid .muted,.ebody .muted{color:var(--muted)} .egrid .gain{color:var(--gain)} .egrid .loss,.emeta .loss{color:var(--loss)} .emeta .gain{color:var(--gain)} .edot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:2px;vertical-align:0} .edot.up{background:var(--gain)} .edot.dn{background:var(--loss)}
.rrow{min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--surface);position:relative;overflow:hidden}
.rrow::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--line)}
.rrow.win::before{background:var(--gain)} .rrow.loss::before{background:var(--loss)} .rrow.warn::before{background:var(--warn)} .rrow.open::before{background:var(--accent)}
.rrow header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rrow header > div:first-child{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rrow .pill{white-space:nowrap} .rstat{display:flex;flex-wrap:wrap;gap:6px;align-items:center} .rstat small{font-size:.74rem}
.rlines{display:grid;gap:6px}
.rline.tfgap{margin-top:8px}

.rline.win{border-left-color:var(--gain)} .rline.loss{border-left-color:var(--loss)} .rline.warn{border-left-color:var(--warn)} .rline.open{border-left-color:var(--accent)}
.rline .tf{font:700 .8rem var(--f-num);min-width:48px}
.rline .pill{justify-self:start;white-space:normal;max-width:100%}
.rline > b{font-size:.95rem;text-align:right;white-space:nowrap}
.rbot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}

.rline .acts{display:flex;gap:4px;margin-left:auto}
.btn.icon{padding:4px 8px;min-width:30px;justify-content:center}

.rlist{grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr))}
.alert.up{background:var(--gain-bg);color:var(--gain);border-color:transparent} .alert.up::before{background:var(--gain)}

.src{font:600 .66rem var(--f-body);letter-spacing:.03em;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:99px;padding:2px 8px;cursor:pointer;vertical-align:middle}

<script>
/* Carnet de positions v1.46.0 · licence MIT */
/*CORE-START*/
// Moteur de calcul pur : aucune dépendance au DOM ni au stockage.
const Core = (() => {
  const nf2 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const nfq = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 8 });

  function usd(x, sign) {
    if (x == null || !isFinite(x)) return 'Non calculable';
    if (Math.abs(x) < 0.005) x = 0;
    const pre = x < 0 ? '−' : (sign && x > 0 ? '+' : '');
    return pre + nf2.format(Math.abs(x)) + ' $';
  }
  function pct(x, sign) {
    if (x == null || !isFinite(x)) return 'Non calculable';
    if (Math.abs(x) < 0.005) x = 0;
    const pre = x < 0 ? '−' : (sign && x > 0 ? '+' : '');
    return pre + nf2.format(Math.abs(x)) + ' %';
  }
  const qty = x => (x == null || !isFinite(x)) ? 'Non calculable' : nfq.format(x);

  function num(v) {
    if (typeof v === 'number') return v;
    if (v == null) return NaN;
    const s = String(v).replace(/[\s  ]/g, '').replace(',', '.');
    if (s === '' || !/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return NaN;
    return Number(s);
  }
  function numOr(v, d) { return (v == null || String(v).trim() === '') ? d : num(v); }
  const isNum = x => typeof x === 'number' && isFinite(x);
  function roundTo(x, d) { const f = Math.pow(10, d); return Math.round(x * f) / f; }
  function floorTo(x, d) { const f = Math.pow(10, d); return Math.floor(x * f + 1e-6) / f; }
  function le(a, b) { return a <= b + 1e-9 * Math.max(1, Math.abs(b)); }
  function days(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5); }

  function normFees(f) {
    f = f || {};
    return { inFixed: numOr(f.inFixed, 0), inPct: numOr(f.inPct, 0), outFixed: numOr(f.outFixed, 0), outPct: numOr(f.outPct, 0), perShare: numOr(f.perShare, 0), minComm: numOr(f.minComm, 0) };
  }
  // Commission du courtier par action (CFD : 1 action par lot), avec un minimum par ordre, à l'entrée comme à la sortie.
  function commission(q, f) { return q > 0 && (f.perShare || f.minComm) ? Math.max(f.minComm || 0, q * (f.perShare || 0)) : 0; }
  // Frais d'entrée et de sortie : part fixe + part proportionnelle au montant échangé + commission par action.
  function feeIn(q, price, f) { return q > 0 ? f.inFixed + q * price * f.inPct / 100 + commission(q, f) : 0; }
  function feeOut(q, price, f) { return q > 0 ? f.outFixed + q * price * f.outPct / 100 + commission(q, f) : 0; }

  // ---------- 1. Calculateur avant achat ----------
  function sizePosition(inp) {
    const fees = normFees(inp.fees);
    const fractional = !!inp.fractional;
    const p = {
      equity: num(inp.equity), riskPct: num(inp.riskPct), entry: num(inp.entry), stop: num(inp.stop),
      leverage: num(inp.leverage), cap: num(inp.cap), fractional,
      decimals: fractional ? numOr(inp.decimals, 4) : 0,
      marginAvail: numOr(inp.marginAvail, null), fees
    };
    const errors = [];
    if (!isNum(p.equity) || p.equity <= 0) errors.push('La valeur nette de référence doit être positive.');
    if (!isNum(p.riskPct) || p.riskPct <= 0 || p.riskPct > 100) errors.push('Le risque par position doit être compris entre 0 et 100 %.');
    if (!isNum(p.entry) || p.entry <= 0) errors.push('Indiquez un prix d’entrée positif.');
    if (!isNum(p.stop) || p.stop <= 0) errors.push('Indiquez un stop initial positif.');
    if (isNum(p.entry) && isNum(p.stop) && p.stop > 0 && p.entry > 0 && p.stop >= p.entry) errors.push('Le stop doit être strictement inférieur au prix d’entrée (achat uniquement).');
    if (!isNum(p.leverage) || p.leverage < 1) errors.push('Le levier doit être supérieur ou égal à 1.');
    if (!isNum(p.cap) || p.cap <= 0) errors.push('Le plafond de position doit être positif.');
    const feeLabels = { inFixed: 'Frais fixes d’entrée', inPct: 'Frais d’entrée en %', outFixed: 'Frais fixes de sortie', outPct: 'Frais de sortie en %', perShare: 'Commission par action', minComm: 'Commission minimum' };
    for (const k in feeLabels) if (!isNum(fees[k]) || fees[k] < 0) errors.push(feeLabels[k] + ' : valeur invalide.');
    if (fractional && (!Number.isInteger(p.decimals) || p.decimals < 0 || p.decimals > 8)) errors.push('La précision doit être un nombre entier de décimales entre 0 et 8.');
    if (p.marginAvail !== null && (!isNum(p.marginAvail) || p.marginAvail < 0)) errors.push('La marge disponible est invalide.');
    if (errors.length) return { ok: false, errors };

    const budget = p.equity * p.riskPct / 100;
    const fixed = fees.inFixed + fees.outFixed;
    const perUnit = (p.entry - p.stop) + p.entry * fees.inPct / 100 + p.stop * fees.outPct / 100 + 2 * fees.perShare;   // le minimum de commission est vérifié ensuite, quantité par quantité
    const lim = {
      risk: Math.max(0, (budget - fixed) / perUnit),
      cap: p.cap / p.entry,
      margin: p.marginAvail === null ? Infinity
        : Math.max(0, (p.marginAvail - fees.inFixed) / (p.entry / p.leverage + p.entry * fees.inPct / 100 + fees.perShare))
    };
    const dec = p.decimals, step = Math.pow(10, -dec);
    const ev = q => {
      const exposure = q * p.entry, margin = exposure / p.leverage;
      const fi = feeIn(q, p.entry, fees), fo = feeOut(q, p.stop, fees);
      const priceRisk = q * (p.entry - p.stop);
      return { q, exposure, margin, feeIn: fi, feeOut: fo, feesRT: fi + fo, priceRisk, totalRisk: priceRisk + fi + fo, marginNeed: margin + fi };
    };
    const fits = r => le(r.totalRisk, budget) && le(r.exposure, p.cap) && (p.marginAvail === null || le(r.marginNeed, p.marginAvail));
    const qMax = Math.min(lim.risk, lim.cap, lim.margin);
    let q = floorTo(qMax, dec), r = ev(q), guard = 0;
    while (q > 0 && !fits(r) && guard++ < 100000) { q = roundTo(q - step, dec); r = ev(q); }
    const binding = qMax === lim.cap ? 'cap' : (qMax === lim.risk ? 'risk' : 'margin');
    const stopDistPct = (p.entry - p.stop) / p.entry * 100;
    const base = { budget, lim, binding, stopDistPct, decimals: dec, step, marginChecked: p.marginAvail !== null, params: p };

    if (!(q > 0)) {
      const r1 = ev(step);
      const unit = dec === 0 ? '1 action' : qty(step) + ' action';
      const parts = [];
      if (fixed >= budget) parts.push(`les frais fixes aller-retour (${usd(fixed)}) atteignent déjà le budget de risque (${usd(budget)})`);
      else if (!le(r1.totalRisk, budget)) parts.push(`le risque estimé serait de ${usd(r1.totalRisk)} pour un budget de ${usd(budget)}`);
      if (!le(r1.exposure, p.cap)) parts.push(`l’exposition serait de ${usd(r1.exposure)} pour un plafond de ${usd(p.cap)}`);
      if (p.marginAvail !== null && !le(r1.marginNeed, p.marginAvail)) parts.push(`la marge et les frais d’entrée (${usd(r1.marginNeed)}) dépasseraient la marge disponible (${usd(p.marginAvail)})`);
      const msg = `Aucune position ne peut être prise : avec la plus petite quantité autorisée (${unit}), ${parts.join(' ; ')}.`
        + (dec === 0 ? ' Les fractions d’action sont désactivées.' : '');
      return Object.assign({ ok: false, blocked: true, errors: [msg] }, base);
    }

    let reason = null;
    if (r.exposure < p.cap - 0.005) {
      if (binding === 'risk') reason = `Taille réduite pour respecter le budget de risque de ${nf2.format(p.riskPct)} % (${usd(budget)}) : le stop est à ${pct(stopDistPct)} de l’entrée${(fixed || fees.inPct || fees.outPct) ? ', frais compris' : ''}.`;
      else if (binding === 'margin') reason = `Taille réduite par la marge disponible (${usd(p.marginAvail)}).`;
      else reason = `Quantité arrondie vers le bas à la précision autorisée (${qty(step)}).`;
      if (binding !== 'cap' && q < floorTo(qMax, dec) - step / 2) reason += ' Ajustée vers le bas après recalcul des frais.';
      else if (binding !== 'cap' && dec === 0) reason += ' Arrondie à l’action entière inférieure.';
    }
    return Object.assign({ ok: true, errors: [], reason, riskPctAccount: r.totalRisk / p.equity * 100, drop10: r.exposure * 0.10 }, base, r);
  }

  // ---------- 2. Comptabilité ----------
  // Swap estimé des CFD à l'achat : chaque nuit de semaine où la ligne est détenue à la clôture,
  // quantité × dernier cours connu × taux annuel ÷ 360, multiplié le jour du rollover triple (vendredi : week-end).
  // Un financement saisi à la main (montant réel du courtier) remplace l'estimation jusqu'à sa date.
  let SW = null;
  const swapMemo = new Map();
  function setSwap(cfg) { SW = cfg && cfg.pct > 0 ? cfg : null; }
  const addDay = d => { const t = new Date(d + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() + 1); return t.toISOString().slice(0, 10); };
  function swapNights(lot) {
    const evs = lot.events || [], ph = priceHist(SW.prices, lot.ticker);
    const manual = evs.reduce((m, e) => e.type === 'funding' && e.date > m ? e.date : m, '');
    const sells = evs.filter(e => e.type === 'sell').sort((a, b) => a.date < b.date ? -1 : 1);
    const sig = [SW.pct, SW.triple, SW.today, lot.date, lot.qty, lot.price, manual, sells.map(e => e.date + ':' + e.qty).join(','), ph.length, ph.length ? ph[ph.length - 1].date + ph[ph.length - 1].price : ''].join('|');
    const hit = swapMemo.get(lot.id);
    if (hit && hit.sig === sig) return hit.nights;
    const px = ph.slice().sort((a, b) => a.date < b.date ? -1 : 1), nights = [];
    let held = lot.qty, si = 0, pi = 0, price = lot.price;
    for (let d = lot.date; d < SW.today; d = addDay(d)) {
      while (si < sells.length && sells[si].date <= d) held -= sells[si++].qty;
      if (held <= 1e-9) break;
      while (pi < px.length && px[pi].date <= d) price = px[pi++].price;
      const wd = new Date(d + 'T12:00:00Z').getUTCDay();
      if (wd === 0 || wd === 6 || d <= manual) continue;
      nights.push([d, held * price * SW.pct / 100 / 360 * (wd === SW.triple ? 3 : 1)]);
    }
    swapMemo.set(lot.id, { sig, nights });
    return nights;
  }
  // Swap estimé jusqu'à la clôture du jour upTo (la nuit de upTo n'est pas encore passée).
  function swapEst(lot, upTo) {
    if (!SW) return 0;
    let t = 0;
    for (const [d, a] of swapNights(lot)) { if (upTo && d >= upTo) break; t += a; }
    return t;
  }
  function lotState(lot, upTo) {
    const evs = (lot.events || []).filter(e => !upTo || e.date <= upTo);
    let sold = 0, gross = 0, exitFees = 0, funding = 0, divs = 0, lastSell = null;
    for (const e of evs) {
      if (e.type === 'sell') {
        sold += e.qty; gross += e.qty * (e.price - lot.price); exitFees += e.fee || 0;
        if (!lastSell || e.date > lastSell) lastSell = e.date;
      } else if (e.type === 'funding') funding += e.amount;
      else if (e.type === 'dividend' || e.type === 'adjust') divs += e.amount;
    }
    let rem = lot.qty - sold;
    if (Math.abs(rem) < 1e-9) rem = 0;
    const fundingEst = swapEst(lot, upTo);
    funding += fundingEst;
    const entryFee = lot.entryFee || 0;
    // Chaque coût n'apparaît qu'une fois : frais d'entrée, frais de sortie, financement (saisi ou estimé).
    const netRealized = gross + divs - entryFee - exitFees - funding;
    return { rem, sold, gross, exitFees, funding, fundingEst, divs, entryFee, txFees: entryFee + exitFees, netRealized, closed: rem <= 0, closeDate: rem <= 0 ? lastSell : null };
  }

  function priceHist(prices, t) { return (prices && prices[t]) || []; }
  function priceOn(prices, t, d) { return priceHist(prices, t).find(x => x.date === d) || null; }
  function lastPrice(prices, t, upTo) {
    let best = null;
    for (const x of priceHist(prices, t)) if ((!upTo || x.date <= upTo) && (!best || x.date >= best.date)) best = x;
    return best;
  }

  // mode 'last' : dernier cours connu ; mode 'exact' : cours saisi exactement à la date upTo.
  function accountState(st, upTo, mode) {
    const s = st.settings;
    let deposits = 0, withdrawals = 0;
    for (const f of st.flows) if (!upTo || f.date <= upTo) { if (f.amount >= 0) deposits += f.amount; else withdrawals -= f.amount; }
    let realized = 0, unreal = 0, txFees = 0, funding = 0, divs = 0, gross = 0, exposure = 0, margin = 0, openCount = 0, minPriceDate = null;
    const missing = [], fallback = [];
    for (const lot of st.lots) {
      if (upTo && lot.date > upTo) continue;
      const ls = lotState(lot, upTo);
      realized += ls.netRealized; txFees += ls.txFees; funding += ls.funding; divs += ls.divs; gross += ls.gross;
      if (ls.closed) continue;
      openCount++;
      let pr = mode === 'exact' ? priceOn(st.prices, lot.ticker, upTo) : lastPrice(st.prices, lot.ticker, upTo);
      if (!pr) {
        if (mode === 'exact') { missing.push(lot.ticker); continue; }
        pr = { price: lot.price, date: lot.date }; fallback.push(lot.ticker);
      }
      unreal += ls.rem * (pr.price - lot.price);
      exposure += ls.rem * pr.price;
      margin += ls.rem * pr.price / (lot.leverage || 1);
      if (!minPriceDate || pr.date < minPriceDate) minPriceDate = pr.date;
    }
    const equity = s.initialCapital + deposits - withdrawals + realized + unreal;
    return { equity, deposits, withdrawals, realized, unreal, txFees, funding, divs, gross, exposure, margin, openCount, minPriceDate, missing, fallback };
  }

  // ---------- 3. Performance ----------
  // Une observation n'existe qu'à une date où chaque position ouverte a un cours saisi ce jour-là,
  // ou quand aucune position n'est ouverte. Les valeurs courtier sont prioritaires à leur date.
  function observations(st, today) {
    const s = st.settings, start = s.startDate;
    const startFlows = st.flows.filter(f => f.date <= start).reduce((a, f) => a + f.amount, 0);
    const map = new Map();
    map.set(start, { date: start, value: s.initialCapital + startFlows, source: 'initial' });
    const dates = new Set();
    for (const t in st.prices) for (const x of st.prices[t]) dates.add(x.date);
    for (const l of st.lots) { dates.add(l.date); for (const e of l.events || []) dates.add(e.date); }
    for (const f of st.flows) dates.add(f.date);
    for (const d of dates) {
      if (d <= start || (today && d > today)) continue;
      const a = accountState(st, d, 'exact');
      if (a.missing.length) continue;
      map.set(d, { date: d, value: a.equity, source: a.openCount ? 'app' : 'app-flat' });
    }
    for (const b of st.snapshots || []) {

const isBackup = n => /^sauvegarde-\d{4}-\d{2}-\d{2}\.json$/.test(n);
async function backupGist(create) {
  if (Store.cfg.backupId) return Store.cfg.backupId;
  for (let page = 1; page <= 10; page++) {
    const list = await gh('/gists?per_page=100&page=' + page);
    const g = list.find(x => x.files && x.files[BACKUP_README]);
    if (g) { Store.cfg.backupId = g.id; writeJSON(SYNC_KEY, Store.cfg); return g.id; }
    if (list.length < 100) break;
  }
  if (!create) return null;
  const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'Carnet de positions : sauvegardes hebdomadaires (gist secret, ne pas rendre public)', public: false,
    files: { [BACKUP_README]: { content: 'Sauvegardes automatiques du Carnet de positions : une par semaine, les ' + BACKUP_KEEP + ' dernières. Restauration depuis l’app, Réglages › Synchronisation et sauvegarde.' } } }) });

}
async function listBackups() {

async function backupNow(force) {

  if (!force && Date.now() - (Store.cfg.lastBackup || 0) < BACKUP_EVERY) return false;
  const id = await backupGist(true);
  const names = Object.keys((await gh('/gists/' + id)).files || {}).filter(isBackup).sort();
  const latest = names.length ? Date.parse(names[names.length - 1].slice(11, 21) + 'T12:00:00') : 0;
  if (!force && Date.now() - latest < BACKUP_EVERY) { Store.cfg.lastBackup = latest; writeJSON(SYNC_KEY, Store.cfg); return false; }
  const name = 'sauvegarde-' + todayISO() + '.json', files = { [name]: { content: JSON.stringify(S) } };
  const all = [...new Set(names.concat(name))].sort();
  for (const n of all.slice(0, Math.max(0, all.length - BACKUP_KEEP))) files[n] = null;
  await gh('/gists/' + id, { method: 'PATCH', body: JSON.stringify({ files }) });
  Store.cfg.lastBackup = Date.now(); writeJSON(SYNC_KEY, Store.cfg);

        const g = list.find(x => x.files && x.files[RADAR_FILE]);
        if (g) { Store.cfg.radarId = g.id; writeJSON(SYNC_KEY, Store.cfg); }
        if (list.length < 100) break;

function readImageFile(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Lecture impossible'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('Image illisible'));
      img.onload = () => {
        let max = 1400, q = 0.78, out;
        for (let i = 0; i < 6; i++) {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          out = cv.toDataURL('image/jpeg', q);
          if (out.length < 230000) break;
          max *= 0.8; q -= 0.08;
        }
        res(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

// Une action par ligne : ticker puis paires « unité période » (ou « période unité » ; une période seule est journalière).
function parseSmaList(text) {
  const map = { J: 'D', D: 'D', S: 'W', W: 'W', M: 'M' }, rows = [], bad = [];
  for (const line of String(text).split(/\n/)) {
    const l = line.trim(); if (!l) continue;
    const [t, ...rest] = l.split(/[;,\t ]+/).map(x => x.trim().toUpperCase()).filter(Boolean);
    const pairs = []; let ok = /^[A-Z0-9.\-]{1,12}$/.test(t || '') && rest.length > 0;
    for (let i = 0; ok && i < rest.length; i++) {
      const a = rest[i], b = rest[i + 1];
      if (map[a] && /^\d+$/.test(b || '')) { pairs.push([map[a], +b]); i++; }
      else if (/^\d+$/.test(a) && map[b]) { pairs.push([map[b], +a]); i++; }
      else if (/^\d+$/.test(a)) pairs.push(['D', +a]);
      else ok = false;
    }
    if (!ok) { bad.push(l); continue; }
    const good = [];
    for (const [tf, n] of pairs) {
      if (!periodOk(tf, n)) bad.push(`${t} ${TF_SHORT[tf]} ${n}`);
      else if (!good.some(([a, b]) => a === tf && b === n)) good.push([tf, n]);
    }
    if (good.length) rows.push({ t, pairs: good });
  }
  return { rows, bad };
}

// ----- Discipline : écarts aux règles de taille et de stop -----
// Sortie à la clôture sous le stop : écart entre le stop en vigueur le jour de la vente et le prix de vente.
// Seules les ventes sous le stop comptent (les autres sont des sorties volontaires).
function stopAt(lot, d) {
  let st = lot.stopInitial;
  for (const e of lot.events.filter(x => x.type === 'stop').sort((a, b) => a.date < b.date ? -1 : 1)) if (e.date <= d) st = e.to;
  return isNum(st) && st > 0 ? st : null;
}
function overshootStats() {
  const xs = [];

    if (e.type !== 'sell') continue;
    const st = stopAt(l, e.date);

  }

  const worst = xs.reduce((a, x) => x.pct > a.pct ? x : a), avg = a => a.length ? a.reduce((s, x) => s + x.pct, 0) / a.length : null;
  const ea = xs.filter(x => x.earn), ot = xs.filter(x => !x.earn);
  return { n: xs.length, avg: avg(xs), worst, earn: { n: ea.length, avg: avg(ea) }, other: { n: ot.length, avg: avg(ot) }, known: xs.some(x => Earn.map[x.t]) };
}

// Résultats des trades clôturés en R : une barre par trade (ordre de clôture), puis leur répartition.
function rCharts(T) {

  if (!tr.length) return '<p class="hint">Les graphiques en R apparaîtront après la première position clôturée.</p>';
  const vw = (document.querySelector('#view') || {}).clientWidth || 700;
  const W = Math.round(Math.max(300, Math.min(700, vw - 38))), H = W < 500 ? 190 : 230, L = 38, Rm = 8, Tp = 10, B = 24;
  const lo = Math.min(-1.5, ...tr.map(c => c.R)), hi = Math.max(1.5, ...tr.map(c => c.R));

  const y = v => Tp + (b - v) / (b - a) * (H - Tp - B);

  let g = '';

  const bars = tr.map((c, i) => {
    const x = L + slot * i + (slot - bw) / 2, y0 = y(0), y1 = y(c.R);
    return `<rect class="${c.R >= 0 ? 'bw' : 'bl'}" x="${x.toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, Math.abs(y1 - y0)).toFixed(1)}" rx="2"><title>${esc(c.lot.ticker)} · ${fmtDate(c.date)} · ${fmtR(c.R)} (${usd(c.net, true)})</title></rect>`;
  }).join('');
  const ref = [-1, 1].map(v => `<line class="rref" x1="${L}" x2="${W - Rm}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>`).join('');
  const lab = `<text x="${L}" y="${H - 6}">${fmtDate(tr[0].date)}</text><text x="${W - Rm}" y="${H - 6}" text-anchor="end">${fmtDate(tr[tr.length - 1].date)}</text>`;
  const svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Résultat de chaque position clôturée, en R">${g}${ref}<line class="zero" x1="${L}" x2="${W - Rm}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}"/>${bars}${lab}</svg>`;
  // Répartition : en suivi de tendance, on cherche beaucoup de petites pertes vers −1 R et quelques gros gains.
  const BK = [['≤ −2 R', r => r <= -2], ['−2 à −1 R', r => r > -2 && r <= -1], ['−1 à 0 R', r => r > -1 && r < 0], ['0 à +1 R', r => r >= 0 && r < 1], ['+1 à +2 R', r => r >= 1 && r < 2], ['+2 à +3 R', r => r >= 2 && r < 3], ['≥ +3 R', r => r >= 3]];
  const cnt = BK.map(([l, f], i) => ({ l, n: tr.filter(c => f(c.R)).length, neg: i < 3 })), mx = Math.max(...cnt.map(c => c.n));
  const dist = cnt.map(c => `<div class="dist-row"><span>${c.l}</span><div class="dist-bar"><i class="${c.neg ? 'bl' : 'bw'}" style="width:${mx ? (c.n / mx * 100).toFixed(1) : 0}%"></i></div><b class="num">${c.n}</b></div>`).join('');
  const best = tr.reduce((m, c) => c.R > m.R ? c : m), worst = tr.reduce((m, c) => c.R < m.R ? c : m);
  return `<p class="chart-t" style="margin-top:14px">Chaque position clôturée, en R</p>${svg}
    <p class="hint">Lignes pointillées : −1 R et +1 R. Meilleure : ${esc(best.lot.ticker)} ${fmtR(best.R)} · pire : ${esc(worst.lot.ticker)} ${fmtR(worst.R)}. Touchez une barre pour le détail.</p>
    <p class="chart-t" style="margin-top:12px">Répartition</p><div class="dist">${dist}</div>`;
}

// Variations entre deux observations consécutives (compte, SPY). Seulement les écarts de 5 jours ou moins (séances, pas des trous).

function benchBlock(P, sel, rangePts) {

  if (!sel || rangePts.length < 2) return { tiles: '', kv: '', at: null };

    let cv = 0, vr = 0; for (const [y, x] of all) { cv += (x - mx) * (y - my); vr += (x - mx) ** 2; }

function chartSVG(pts, bench) {
  if (pts.length < 2) return '<p class="hint">La courbe apparaîtra après deux observations.</p>';
  const vw = (document.querySelector('#view') || {}).clientWidth || 700;
  const W = Math.round(Math.max(320, Math.min(700, vw - 38))), H = W < 500 ? 220 : 280, L = 46, R = 10, Tp = 14, B = 28;
  const t0 = Date.parse(pts[0].date), t1 = Date.parse(pts[pts.length - 1].date);
  const ticks = (lo, hi, n) => {
    if (hi - lo < 1) { hi += 0.5; lo -= 0.5; }
    const stepRaw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(stepRaw)));
    const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(s => s >= stepRaw);
    return { lo: Math.floor(lo / step) * step, hi: Math.ceil(hi / step) * step, step };
  };
  const x = d => L + (t1 === t0 ? 0 : (Date.parse(d) - t0) / (t1 - t0)) * (W - L - R);
  const grid = (sc, y) => { let g = ''; for (let v = sc.lo; v <= sc.hi + 1e-9; v += sc.step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmtNum(v, 1)} %</text>`; return g; };
  // Courbe cumulée corrigée des apports
  const vals = pts.map(p => (p.index - 1) * 100);
  // S&P 500 rebasé à 0 % au premier point, aux mêmes dates.
  const b0 = bench && bench(pts[0].date), bv = b0 > 0 ? pts.map(p => { const v = bench(p.date); return v > 0 ? (v / b0 - 1) * 100 : null; }) : null;
  const allV = vals.concat(bv ? bv.filter(v => v != null) : []);
  const sc = ticks(Math.min(0, ...allV), Math.max(0, ...allV), 4);
  const y = v => Tp + (sc.hi - v) / (sc.hi - sc.lo) * (H - Tp - B);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.date).toFixed(1)},${y((p.index - 1) * 100).toFixed(1)}`).join('');
  const area = path + `L${x(pts[pts.length - 1].date).toFixed(1)},${y(sc.lo)}L${x(pts[0].date).toFixed(1)},${y(sc.lo)}Z`;
  const dots = pts.map(p => `<circle class="dot ${p.source === 'courtier' ? 'br' : (p.est ? 'est' : '')}" cx="${x(p.date).toFixed(1)}" cy="${y((p.index - 1) * 100).toFixed(1)}" r="3.5"><title>${fmtDate(p.date)} : ${pct((p.index - 1) * 100, true)} · ${usd(p.value)}</title></circle>`).join('');
  const bpath = bv ? pts.map((p, i) => bv[i] == null ? '' : `${i && bv[i - 1] != null ? 'L' : 'M'}${x(p.date).toFixed(1)},${y(bv[i]).toFixed(1)}`).join('') : '';
  const lab = `<text x="${L}" y="${H - 8}">${fmtDate(pts[0].date)}</text><text x="${W - R}" y="${H - 8}" text-anchor="end">${fmtDate(pts[pts.length - 1].date)}</text>`;
  const main = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de performance cumulée corrigée des apports"><defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>${grid(sc, y)}<line class="zero" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/><path class="area" d="${area}"/>${bpath ? `<path class="bench" d="${bpath}"/>` : ''}<path class="line" d="${path}"/>${dots}${lab}</svg>${bpath ? '<div class="blegend"><span><i class="me"></i>Votre compte</span><span><i class="sp"></i>S&amp;P 500 (SPY, dividendes inclus)</span></div>' : ''}`;
  // Drawdown : recul depuis le plus haut précédent
  let peak = pts[0].index;

  return main + `<p class="chart-t">Drawdown</p><svg class="chart" viewBox="0 0 ${W} ${H2}" role="img" aria-label="Recul depuis le plus haut">${g2}<path class="dd" d="${dpath}L${x(pts[pts.length - 1].date).toFixed(1)},${y2(0)}L${x(pts[0].date).toFixed(1)},${y2(0)}Z"/><path class="ddl" d="${dpath}"/></svg>`;

    <div class="banner info"><span><strong>Sauvegarde automatique</strong> chaque semaine dans un second Gist secret, les ${BACKUP_KEEP} dernières gardées (positions, flux, cours, radar ; les captures restent dans le Gist principal).
      ${Store.cfg.lastBackup ? 'Dernière : ' + new Date(Store.cfg.lastBackup).toLocaleDateString('fr-FR') + '.' : 'Première sauvegarde à la prochaine synchronisation.'}</span></div>

  return `<div class="banner warn"><span><strong>Données conservées uniquement sur cet appareil.</strong> Connectez GitHub pour synchroniser Mac et iPhone, ou exportez régulièrement en JSON.</span></div>
    <details class="lot"><summary><span><span class="tk">Activer la synchronisation</span><br><small>Gratuit, avec votre compte GitHub. Environ 2 minutes, une fois par appareil.</small></span><span class="pill open">Guide</span></summary>
    <div class="body">
      <ol class="lead" style="padding-left:18px;margin:0;display:grid;gap:6px">
        <li>Ouvrez <a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=Carnet%20de%20positions" target="_blank" rel="noopener">GitHub › nouveau jeton (classic)</a>, connecté à votre compte.</li>
        <li>Laissez cochée uniquement la case <strong>gist</strong>, choisissez une expiration (par exemple « No expiration »), puis <strong>Generate token</strong>.</li>
        <li>Copiez le jeton (il commence par <code>ghp_</code>) et collez-le ci-dessous. Gardez-le dans vos mots de passe pour l’autre appareil.</li>
      </ol>
      <div class="fields"><div class="fld wide"><label for="sync-token">Jeton GitHub (droit gist uniquement)</label><input id="sync-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ghp_…"></div></div>
      <div class="row"><button class="btn primary" data-act="sync-on">Connecter</button></div>
      <p class="hint">Vos données vont dans un Gist <strong>secret</strong> de votre compte : invisible dans votre profil, mais lisible par quiconque obtiendrait son adresse. Le jeton reste sur cet appareil et ne permet que de lire et écrire vos gists.</p>

const F = (form, n) => form.elements[n] ? form.elements[n].value : '';
const inp = (id, label, val, attrs = '', hint = '') => `<div class="fld"><label for="f-${id}">${label}</label><input id="f-${id}" name="${id}" value="${esc(val == null ? '' : val)}" ${attrs}>${hint ? `<p class="hint">${hint}</p>` : ''}</div>`;
const dec = (id, label, val, attrs = '', hint = '') => inp(id, label, val, 'inputmode="decimal" autocomplete="off" ' + attrs, hint);
const dateInp = (id, label, val) => `<div class="fld"><label for="f-${id}">${label}</label><input type="date" id="f-${id}" name="${id}" value="${esc(val)}" required></div>`;
const planSel = (val) => `<div class="fld"><label for="f-planOk">Plan respecté</label><select id="f-planOk" name="planOk"><option value="" ${val == null ? 'selected' : ''}>Non renseigné</option><option value="yes" ${val === true ? 'selected' : ''}>Oui</option><option value="no" ${val === false ? 'selected' : ''}>Non</option></select></div>`;
const planVal = v => v === 'yes' ? true : v === 'no' ? false : null;
function need(cond, msg) { if (!cond) throw new Error(msg); }
function findLot(id) { return S.lots.find(l => l.id === id); }
function addPrice(ticker, date, price, demo, src) {
  const h = S.prices[ticker] = S.prices[ticker] || [];
  const i = h.findIndex(x => x.date === date);
  const rec = { date, price }; if (demo) rec.demo = true; if (src) rec.src = src;
  if (i >= 0) h[i] = rec; else h.push(rec);
  h.sort((a, b) => a.date < b.date ? -1 : 1);
}

function riskOf(q, price, stop, entryFee, f) {
  if (!(q > 0 && price > 0 && stop > 0)) return null;
  return q * (price - stop) + entryFee + Core.feeOut(q, stop, f);
}
function sheetBuy() {
  const r = Core.sizePosition(calcInput()); if (!r.ok) return;
  const d = calcDraft, ref = referenceCapital();
  const f = Core.normFees({ inFixed: d.inFixed, inPct: d.inPct, outFixed: d.outFixed, outPct: d.outPct, perShare: S.settings.fees.perShare, minComm: S.settings.fees.minComm });
  openSheet({
    title: 'Confirmer l’achat exécuté', ok: 'Enregistrer l’achat',
    body: `<p class="lead">Corrigez avec les valeurs réellement exécutées chez le courtier.</p><div class="fields">

      ${dec('price', 'Prix exécuté ($)', d.entry)}
      ${dec('qty', 'Quantité exécutée', r.q)}
      ${dec('leverage', 'Levier (×)', d.leverage)}
      ${dec('entryFee', 'Frais réels d’entrée ($)', Core.roundTo(r.feeIn, 4))}
      ${dec('stop', 'Stop initial ($)', d.stop)}
      ${motifField((d.ticker || '').toUpperCase(), todayISO(), '')}
      <div class="fld wide"><label>Entrée grâce à quelle(s) SMA ?</label><div id="buySma" data-t="${esc((d.ticker || '').toUpperCase())}">${smaChoices((d.ticker || '').toUpperCase(), [])}</div><p class="hint">Seuls les stops de ces SMA vous seront proposés.</p></div>
      <div class="fld wide"><label for="f-note">Note</label><textarea id="f-note" name="note" placeholder="facultatif"></textarea></div>
      <div class="fld wide"><label class="check"><input type="checkbox" name="auto" ${manualSet().has((d.ticker || '').toUpperCase()) ? '' : 'checked'}> Action US : cours automatiques Finnhub</label><p class="hint">Décochez pour une action hors USA : vous saisirez son cours à la main.</p></div>
      <div class="fld wide"><label for="f-img">Capture du graphique</label><input type="file" id="f-img" name="img" accept="image/*"><p class="hint">Facultatif. Compressée avant sauvegarde.</p></div>
    </div><div id="buyCheck" class="banner info"></div>`,
    onInput: form => {
      const q = num(F(form, 'qty')), p = num(F(form, 'price')), st = num(F(form, 'stop')), fe = numOr(F(form, 'entryFee'), 0), lv = num(F(form, 'leverage'));
      const bt = F(form, 'ticker').trim().toUpperCase(), bs = $('#buySma');
      if (bs && bs.dataset.t !== bt) { bs.dataset.t = bt; bs.innerHTML = smaChoices(bt, []); }
      const risk = riskOf(q, p, st, fe, f), box = $('#buyCheck');
      if (risk == null || !(st < p) || !(lv >= 1)) { box.className = 'banner err'; box.textContent = 'Vérifiez prix, quantité, stop (inférieur au prix) et levier.'; return; }
      const rp = risk / ref.value * 100, over = risk > r.budget + 0.005, expo = q * p;
      const ma = marginAfter(expo / lv), low = ma && ma.after < (S.settings.marginMin || 150);
      box.className = 'banner ' + (over || low || expo > r.params.cap + 0.005 ? 'warn' : 'info');
      box.innerHTML = (low ? `<strong>Niveau de marge après achat ≈ ${fmtNum(ma.after, 0)} %</strong>, sous votre seuil de ${fmtNum(S.settings.marginMin || 150, 0)} %. ` : '') + `Exposition <strong class="num">${usd(expo)}</strong> · marge ≈ <span class="num">${usd(expo / lv)}</span> · risque initial <strong class="num">${usd(risk)}</strong> (${pct(rp)} de ${usd(ref.value)})${over ? ' · <strong>dépasse le budget de ' + usd(r.budget) + '</strong>' : ''}${expo > r.params.cap + 0.005 ? ' · <strong>dépasse le plafond</strong>' : ''}`;
    },
    onSubmit: async form => {
      const t = F(form, 'ticker').trim().toUpperCase(), date = F(form, 'date');
      const q = num(F(form, 'qty')), p = num(F(form, 'price')), st = num(F(form, 'stop')), fe = numOr(F(form, 'entryFee'), NaN), lv = num(F(form, 'leverage'));
      need(/^[A-Z0-9.\-]{1,12}$/.test(t), 'Ticker invalide (lettres, chiffres, point ou tiret).');
      need(date, 'Date requise.');
      need(p > 0 && q > 0, 'Prix et quantité doivent être positifs.');
      need(st > 0 && st < p, 'Le stop initial doit être positif et inférieur au prix d’achat.');
      need(lv >= 1, 'Levier invalide.');
      need(isNum(fe) && fe >= 0, 'Frais d’entrée invalides.');
      const id = uid(); let imgId = null;
      const file = form.elements.img.files[0];
      if (file) { imgId = 'i' + id; await putImage(imgId, await readImageFile(file)); }
      const estExitFee = Core.feeOut(q, st, f);
      const risk = q * (p - st) + fe + estExitFee;
      S.lots.push({ id, ticker: t, date, price: p, qty: q, leverage: lv, entryFee: fe, estExitFee, stopInitial: st, stopCurrent: st,
        refCapital: ref.value, refDate: ref.date, riskInitial: risk, riskInitialPct: risk / ref.value * 100, riskPlan: ref.value * S.settings.riskPct / 100,
        motif: F(form, 'motif'), motifSet: !!F(form, 'motif'), note: F(form, 'note').trim(), imgId, planOk: null, planComment: '', events: [], smas: smaPicked(form) });
      const smaN = smaToRadar(form, t, smaPicked(form)); if (smaN) refreshRadar();
      const lp = Core.lastPrice(S.prices, t);
      if (!lp || lp.date <= date) addPrice(t, date, p);
      const man = manualSet();
      if (!form.elements.auto.checked) man.add(t); else man.delete(t);
      S.settings.manualTickers = [...man].sort();
      calcDraft = null; tab = 'pos'; openLots.add('p-' + id);
      save('Achat enregistré');
    }
  });
}
function sheetSell(lot) {
  const ls = Core.lotState(lot), f = fees(), last = Core.lastPrice(S.prices, lot.ticker);
  openSheet({
    title: 'Vente ' + lot.ticker, ok: 'Enregistrer la vente',
    body: `<p class="lead">Reste ${qty(ls.rem)} action(s) achetée(s) à ${usd(lot.price)}. Une vente totale clôture la position.</p><div class="fields">
      ${dateInp('date', 'Date', todayISO())}
      ${dec('qty', 'Quantité vendue', ls.rem)}

      const fe = numOr(feeEl.value, 0), box = $('#sellCheck');
      if (!(q > 0 && p > 0)) { box.textContent = 'Saisissez quantité et prix.'; return; }
      box.innerHTML = `Résultat de cette vente : <strong class="num ${cls(q * (p - lot.price) - fe)}">${usd(q * (p - lot.price) - fe, true)}</strong> (frais de sortie déduits)${q >= ls.rem - 1e-9 ? ' · clôture la position' : ''}`;
    },
    onSubmit: async form => {
      const q = num(F(form, 'qty')), p = num(F(form, 'price')), fe = numOr(F(form, 'fee'), 0), date = F(form, 'date');
      need(date, 'Date requise.'); need(date >= lot.date, 'La vente ne peut pas précéder l’achat.');
      need(q > 0 && q <= ls.rem + 1e-9, `Quantité entre 0 et ${qty(ls.rem)}.`);

      const id = uid(), file = form.elements.img.files[0]; let imgId = null;
      if (file) { imgId = 'i' + id; await putImage(imgId, await readImageFile(file)); }

    }
  });
}

    const ls = Core.lotState(lot, D); if (ls.rem <= 1e-9) continue;

    rows.push({ lot, cur: ls.funding, man, est: ls.fundingEst, expo: ls.rem * lot.price });

}
function mt5Due() {

  const t = todayISO(); try { if (localStorage.getItem(MT5_SNOOZE) === t) return null; } catch (e) {}
  let fri = t; while (wdOf(fri) !== 5) fri = addDays(fri, -1);

  const gEq = v - a.equity, gPct = a.equity > 0 ? gEq / a.equity * 100 : 0, gM = mu == null ? null : mu - a.margin, gSw = mtSw == null ? null : mtSw - appSw;

  render();
  if (Store.cfg) { setSync('saving'); syncNow(); } else setSync('local');
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['dash', 'calc', 'pos', 'radar', 'set', 'lab', 'earn'].includes(h) && h !== tab) { tab = h; render(); window.scrollTo(0, 0); } });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  // Cours automatiques : à l'ouverture, au retour sur l'app, puis toutes les 2 minutes pendant la séance.
  refreshQuotes();
  // Historique du radar : d'abord celui du robot (Gist), puis Twelve Data seulement pour ce qui manque.
  const radarUp = throttle => (Store.cfg ? pullSharedRadar(throttle).catch(() => {}) : Promise.resolve()).then(() => refreshRadar());
  loadRadarCache().then(() => { render(); radarUp(false); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { badgeN = -1; badgeSoon(); if (Date.now() - Live.at > 60000) refreshQuotes(); radarUp(true); } });
  setInterval(() => { if (document.visibilityState === 'visible' && tab !== 'calc' && marketOpen(Date.now())) refreshQuotes(false, Date.now() - (Live.fullAt || 0) < 600000); }, 120000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Store.cfg) scheduleSync(200); });
  window.addEventListener('online', () => { if (Store.cfg) scheduleSync(200); });
  window.addEventListener('pageshow', e => { if (e.persisted && Store.cfg) scheduleSync(200); });
  setInterval(() => { if (Store.cfg && document.visibilityState === 'visible') syncNow(); }, 30000);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    const hadCtrl = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtrl && $('#sheet').hidden) location.reload(); });
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(r => { document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update().catch(() => {}); }); }).catch(() => {});
  }
})();
</script>
</body>
